name: Tests

on: [push, pull_request]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        options: --health-cmd="pg_isready" --health-interval 10s --health-timeout 5s --health-retries 3
        ports:
          - 5432:5432
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb' || '' }}
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3
        ports:
          - 3306:3306

    strategy:
      fail-fast: false
      matrix:
        moodle-branch: ['MOODLE_502_STABLE', 'MOODLE_503_STABLE']
        php: ['8.3']
        database: ['mariadb', 'pgsql']
        include:
          - php: '8.4'
            moodle-branch: 'main'
            database: 'pgsql'

    steps:
      - name: checkout plugin
        uses: actions/checkout@v7
        with:
          path: this-plugin

      - name: localstack
        run: |
           npm install -g @localstack/lstk
           lstk setup aws
           lstk start
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      - name: setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000,  opcache.enable_cli=1, opcache.jit = disable
          tools: composer
          coverage: pcov

      - name: composer
        run: |
           composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci
           echo $(cd ci/bin; pwd) >> $GITHUB_PATH
           echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
           sudo locale-gen en_AU.UTF-8
           echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV
           npm install -g @localstack/lstk

      - name: install Moodle
        run: moodle-plugin-ci --ansi install --db-host=127.0.0.1 --plugin this-plugin
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: prepare localstack
        working-directory: moodle
        run: |
          lstk aws --endpoint-url http://localhost:4566 --no-verify-ssl s3 mb s3://testbucket
          lstk aws --endpoint-url http://localhost:4566 --no-verify-ssl s3 cp public/lib/tests/fixtures/1.jpg s3://testbucket/testfile.jpg
          lstk aws --endpoint-url http://localhost:4566 --no-verify-ssl s3 cp public/lib/tests/fixtures/1.jpg s3://testbucket/glacier.jpg  --storage-class=GLACIER
          lstk aws --endpoint-url http://localhost:4566 --no-verify-ssl s3 cp public/course/tests/fixtures/image.jpg s3://testbucket/fakedirectory/image.jpg
          lstk aws --endpoint-url http://localhost:4566 --no-verify-ssl s3 cp public/course/tests/fixtures/image.jpg s3://testbucket/testdirectory/testfile.jpg

      - name: phplint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci --ansi phplint

      - name: phpmd
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci --ansi phpmd

      - name: phpdoc
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci --ansi phpdoc

      - name: codechecker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci --ansi codechecker

      - name: validate
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci --ansi validate

      - name: savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci --ansi savepoints

      - name: grunt
        if: ${{ matrix.moodle-branch == 'main'}}
        run: moodle-plugin-ci --ansi grunt

      - name: mustache
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci --ansi mustache

      - name: phpunit
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci --ansi phpunit --testdox --coverage-text --coverage-clover

      - name: privacy
        if: ${{ !cancelled() }}
        run: vendor/bin/phpunit --colors --no-coverage --testsuite tool_dataprivacy_testsuite,tool_policy_testsuite,core_privacy_testsuite
        working-directory: moodle

      - name: coveralls
        continue-on-error: true
        run: moodle-plugin-ci coveralls-upload
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: firefox
        id: firefox
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci --ansi behat

      - name: faildump
        if: ${{ failure() && steps.firefox.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: firefox faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore
 
      - name: chrome
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci --ansi behat --profile chrome

      - name: admin bookmarks
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci --ansi behat --auto-rerun=0 --profile chrome public/blocks/admin_bookmarks
        working-directory: moodle

      - name: admin xmldb
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci --ansi behat --auto-rerun=0 --profile chrome public/admin/tool/xmldb
        working-directory: moodle
